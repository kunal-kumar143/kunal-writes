
<!DOCTYPE html>
<html>
<head>
    <title>My Profile</title>

    <style>
        body {
            background: linear-gradient(to right, #667eea, #764ba2);
            font-family: Arial;
            text-align: center;
            padding: 50px;
        }

        .card {
            background-color: white;
            padding: 30px;
            border-radius: 20px;
            max-width: 350px;
            margin: auto;
        }

        h1 {
            color: #764ba2;
        }

        p {
            color: #555;
            font-size: 18px;
        }

        button {
            background-color: #764ba2;
            color: white;
            padding: 12px 25px;
            border: none;
            border-radius: 10px;
            cursor: pointer;
        }
    </style>
</head>

<body>

    <div class="card">

        <h1>My Profile</h1>

        <p>Hello! I am a College Student.</p>

        <p>I know C++ and DSA.</p>

        <p>Now I am learning Web Development.</p>

        <button>Contact Me</button>

    </div>

</body>
</html>
